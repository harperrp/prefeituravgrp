<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícia — Prefeitura de Vargem Grande do Rio Pardo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#0a1f0a;--g2:#0d3b0d;--g4:#1a7a1a;--g5:#2ecc40;--ouro:#f5c518;--cinza:#f4f6f4;--branco:#fff;--txt:#1a2a1a;--txt2:#4a5e4a;--s1:0 4px 20px rgba(0,60,0,.09);--s2:0 12px 48px rgba(0,60,0,.16)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Barlow",sans-serif;background:var(--cinza);color:var(--txt);overflow-x:hidden}.top{background:rgba(6,18,6,.97);border-bottom:2px solid #162616;position:sticky;top:0;z-index:10}.top-in{max-width:1180px;margin:0 auto;padding:0 24px;min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}.brand img{height:50px;max-width:220px;object-fit:contain}.brand-txt{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.brand-txt em{color:var(--g5);font-style:normal}.nav a{font-family:"Barlow Condensed",sans-serif;color:#6aa06a;text-decoration:none;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;margin-left:18px}.nav a:hover{color:#fff}.hero{background:linear-gradient(135deg,var(--g1),var(--g2));padding:54px 0 42px;border-bottom:3px solid var(--g4);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(46,204,64,.12),transparent 38%)}.wrap{max-width:1180px;margin:0 auto;padding:0 24px;position:relative;z-index:2}.back{display:inline-flex;align-items:center;gap:8px;color:#7fb87f;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}.back:hover{color:var(--g5)}.cat{display:inline-block;background:var(--ouro);color:#000;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;margin-bottom:16px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}h1{font-family:"Barlow Condensed",sans-serif;font-size:clamp(34px,5vw,62px);line-height:.95;color:#fff;text-transform:uppercase;letter-spacing:1.5px;max-width:920px}.date{margin-top:14px;color:#95bd95;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.main{padding:46px 0 70px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}.article{background:#fff;border-radius:12px;box-shadow:var(--s1);overflow:hidden}.cover{width:100%;height:min(520px,48vw);min-height:260px;background:#0d3b0d;background-size:cover;background-position:center}.article-body{padding:34px}.summary{font-size:20px;line-height:1.55;color:var(--txt);font-weight:600;border-left:4px solid var(--g5);padding-left:18px;margin-bottom:26px}.content{font-size:17px;line-height:1.85;color:var(--txt2);white-space:pre-line}.side{display:flex;flex-direction:column;gap:16px}.box{background:#fff;border-radius:12px;box-shadow:var(--s1);padding:22px}.box h3{font-family:"Barlow Condensed",sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.box p{font-size:14px;line-height:1.6;color:var(--txt2)}.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--g4);color:#fff;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:10px 14px;border-radius:6px;border:0;cursor:pointer}.btn:hover{background:var(--g5)}.loading,.error{background:#fff;border-radius:12px;box-shadow:var(--s1);padding:26px;font-size:17px;color:var(--txt2)}.error{border-left:4px solid #f85149}.footer{background:#071107;color:#5d815d;text-align:center;padding:24px;font-size:12px;letter-spacing:1px;text-transform:uppercase}@media(max-width:850px){.layout{grid-template-columns:1fr}.nav{display:none}.article-body{padding:24px}.cover{height:280px}h1{font-size:38px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/">
      <img src="assets/img/logo.png" alt="Prefeitura de Vargem Grande do Rio Pardo" onerror="this.style.display='none'">
      <span class="brand-txt">Vargem <em>Grande</em></span>
    </a>
    <nav class="nav">
      <a href="/">Início</a>
      <a href="/#noticias">Notícias</a>
      <a href="/#obras">Obras</a>
      <a href="/#licitacoes">Licitações</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <a class="back" href="/">← Voltar para o portal</a>
    <div id="heroContent">
      <span class="cat">Notícia</span>
      <h1>Carregando notícia...</h1>
      <div class="date">Aguarde</div>
    </div>
  </div>
</section>

<main class="main">
  <div class="wrap">
    <div id="noticiaContainer" class="loading">Carregando conteúdo da notícia...</div>
  </div>
</main>

<footer class="footer">Prefeitura de Vargem Grande do Rio Pardo — Portal Oficial</footer>

<script src="assets/js/api-client.js"></script>
<script src="assets/js/noticia-detalhe.js"></script>
</body>
</html>
